<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Robot Head -->
  <rect x="6" y="3" width="12" height="9" rx="2" stroke="currentColor" stroke-width="1.5"/>
  <!-- Eyes -->
  <circle cx="9.5" cy="7.5" r="1.2" fill="currentColor"/>
  <circle cx="14.5" cy="7.5" r="1.2" fill="currentColor"/>
  <!-- Antenna -->
  <line x1="12" y1="3" x2="12" y2="1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="12" cy="0.5" r="0.8" fill="currentColor"/>
  <!-- Body -->
  <rect x="7" y="13" width="10" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
  <!-- Neck -->
  <line x1="10" y1="12" x2="14" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Body Details - circuit lines -->
  <line x1="12" y1="14.5" x2="12" y2="18.5" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
  <line x1="9.5" y1="16.5" x2="14.5" y2="16.5" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
  <!-- Arms -->
  <line x1="6" y1="15" x2="4" y2="17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="18" y1="15" x2="20" y2="17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="9.5" y1="20" x2="9.5" y2="23" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="14.5" y1="20" x2="14.5" y2="23" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
</svg>
