<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Document Gradient -->
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Scan Beam Gradient -->
    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <!-- Laser Line Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="1" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.2" />
    </linearGradient>

    <!-- PDF Tag Gradient -->
    <linearGradient id="pdfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>

    <!-- Word Tag Gradient -->
    <linearGradient id="wordGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />

  <!-- Inner Soft Glow -->
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />

  <!-- Document Sheet -->
  <g filter="url(#dropShadow)">
    <path d="M34 24 C34 20.6863 36.6863 18 40 18 H76 L94 36 V100 C94 103.314 91.3137 106 88 106 H40 C36.6863 106 34 103.314 34 100 Z" fill="url(#docGrad)" />
    <!-- Folded Corner -->
    <path d="M76 18 V34 C76 35.1046 76.8954 36 78 36 H94 Z" fill="#CBD5E1" />
  </g>

  <!-- Document Header Lines -->
  <rect x="44" y="28" width="24" height="3.5" rx="1.75" fill="#64748B" />
  <rect x="44" y="35" width="18" height="3" rx="1.5" fill="#94A3B8" />

  <!-- Document Content Mock Lines (Top) -->
  <rect x="44" y="45" width="40" height="3" rx="1.5" fill="#94A3B8" />
  <rect x="44" y="52" width="34" height="3" rx="1.5" fill="#94A3B8" />

  <!-- Scan Field / Highlight Overlay -->
  <rect x="36" y="56" width="56" height="24" fill="url(#scanBeam)" />

  <!-- OCR Laser Scan Line -->
  <line x1="32" y1="68" x2="96" y2="68" stroke="url(#laserGrad)" stroke-width="2.5" filter="url(#glow)" />
  <circle cx="64" cy="68" r="2.5" fill="#FFFFFF" filter="url(#glow)" />

  <!-- OCR Recognized Text Lines (Bottom - Colored / Processed) -->
  <rect x="44" y="74" width="40" height="3.5" rx="1.75" fill="#6366F1" />
  <rect x="44" y="82" width="36" height="3.5" rx="1.75" fill="#8B5CF6" />
  <rect x="44" y="90" width="26" height="3.5" rx="1.75" fill="#3B82F6" />

  <!-- Extraction Sparkles / Magic Stars -->
  <path d="M98 22 Q98 28 104 28 Q98 28 98 34 Q98 28 92 28 Q98 28 98 22 Z" fill="#FDE047" filter="url(#glow)" />
  <path d="M26 44 Q26 48 30 48 Q26 48 26 52 Q26 48 22 48 Q26 48 26 44 Z" fill="#38BDF8" filter="url(#glow)" />

  <!-- Left Badge: PDF Tag -->
  <g filter="url(#dropShadow)" transform="translate(20, 80)">
    <rect width="26" height="15" rx="4" fill="url(#pdfGrad)" />
    <text x="13" y="11" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="900" text-anchor="middle" letter-spacing="0.5">PDF</text>
  </g>

  <!-- Conversion Arrow -->
  <path d="M48 88 L54 88 M52 85 L55 88 L52 91" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Right Badge: DOCX Tag -->
  <g filter="url(#dropShadow)" transform="translate(56, 80)">
    <rect width="32" height="15" rx="4" fill="url(#wordGrad)" />
    <text x="16" y="11" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="900" text-anchor="middle" letter-spacing="0.5">DOCX</text>
  </g>
</svg>
