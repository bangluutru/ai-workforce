<!doctype html>
<meta charset="utf-8">
<title>Hand-Drawn Animation — Starter Skeleton</title>
<style>
  body {
    margin: 0;
    background: #141416;
    color: #e0e0e0;
    font: 13px system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  canvas {
    max-width: 100vw;
    max-height: 86vh;
    object-fit: contain;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  }
  .bar {
    display: flex;
    gap: 8px;
    padding: 10px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
  }
</style>
<canvas id="c"></canvas>
<script src="core.js"></script>
<script src="rig.js"></script>
<script src="character-hero.js"></script>
<script>
'use strict';
/* =====================================================================
   FILM: [Tên Phim / Tên Dự Án]
   Duration: 20.0 s · 16:9 (1920x1080) · 24 fps
   
   1. BRIEF
   - Chủ đề / Ý tưởng: [Mô tả 1-2 câu]
   - Phong cách (Look): doodlePastel | pencilMinimal | screenSea | paperInk | risoPop
   - Cung bậc cảm xúc: Giới thiệu → Thử thách/Trở ngại → Cao trào nỗ lực → Thành công/Kết

   2. BEAT SHEET (Cấu trúc phân cảnh)
   t(s)   dur(s)  Cảnh (Scene)     Khán giả chú ý gì      Camera & Chuyển động           Âm thanh
   0.0    5.0     A-intro          Thiết lập bối cảnh     Wide pan, zoom nhẹ             Giai điệu mở đầu
   5.0    5.0     B-conflict       Gặp khó khăn/thử thách Medium push-in                 Tiết tấu dồn dập
   10.0   5.0     C-action         Nỗ lực vượt qua        Dynamic tracking, shake        Cao trào
   15.0   5.0     D-triumph        Đạt mục tiêu, kết đẹp  Pull-back, hold 2s cuối        Ngân vang êm dịu

   3. CHARACTER BIBLE (khóa trước khi dựng shot; phim dài: tách ra character-<ten>.js dùng chung)
   - Nhân vật: [tên] · chiều cao chuẩn [px thế giới] · màu chủ đạo / màu nhấn
   - Model sheet đã duyệt: [đường dẫn ảnh model sheet]
   - Bất biến: tỉ lệ đầu/thân, số ngón, phụ kiện, thứ tự lớp (xa → thân → đầu → gần)
   ===================================================================== */

// ===================== 1. BẢNG MÀU (PALETTE) =====================
// Chọn 1 trong các bảng màu chuẩn hoặc tùy biến makePalette():
//   'doodlePastel'  : Nét vẽ hoạt hình vui nhộn, tươi sáng (Explainer, Cartoon)
//   'pencilMinimal' : Bút chì phác thảo sổ tay nghệ thuật (Sketchbook, Bio)
//   'screenSea'     : Đồ họa poster phẳng retro, tương phản cao (Graphic/Modern)
//   'paperInk'      : Mực tàu / bút mực cổ điển (Calligraphy, Classic Ink)
//   'risoPop'       : Mực in Riso 3 bản kẽm (Vintage Print, Indie Look)
const PALETTE = PALETTES.doodlePastel;

// W, H, CX, CY được core.js quản lý và cập nhật tự động khi defineFilm chạy.

// PATTERN: Camera đồng bộ cho mọi layer
function applyView(g, v, parallax = 1, anchorY = 0) {
  cam(g, v.x * parallax, (v.y - anchorY) * parallax + anchorY, v.z, v.rot);
}

// PATTERN (Bắt buộc): Đăng ký vùng chủ thể để scripts/qa.mjs đo kích thước nhân vật
function markFocus(c, pts) {
  const m = c.getTransform(); let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const [x, y] of pts) {
    const X = m.a * x + m.c * y + m.e, Y = m.b * x + m.d * y + m.f;
    x0 = Math.min(x0, X); y0 = Math.min(y0, Y); x1 = Math.max(x1, X); y1 = Math.max(y1, Y);
  }
  const cw = c.canvas.width, ch = c.canvas.height, f = window.__focus;
  const b = [Math.max(0, x0), Math.max(0, y0), Math.min(cw, x1), Math.min(ch, y1)];
  if (b[2] > b[0] && b[3] > b[1]) window.__focus = f ? [Math.min(f[0], b[0]), Math.min(f[1], b[1]), Math.max(f[2], b[2]), Math.max(f[3], b[3])] : b;
}

// ===================== 2. THIẾT KẾ BỐI CẢNH (WORLD & SET) =====================
// Dựng không gian thế giới một lần với tọa độ chuẩn. Camera di chuyển sẽ tự động tạo parallax.
function drawWorld(c, T, view, seed = 1) {
  // Lớp 1: Bầu trời / nền giấy có chất liệu
  paper(c);

  applyView(c, view);

  // Lớp 2: Hậu cảnh xa (núi đồi / đường chân trời)
  c.save();
  c.fillStyle = PAL.light || '#eef3f7';
  c.beginPath();
  c.moveTo(-2000, 100);
  for (let x = -2000; x <= 2000; x += 180) {
    const y = 80 + Math.sin(x * 0.003 + seed) * 40;
    c.lineTo(x, y);
  }
  c.lineTo(2000, 1200);
  c.lineTo(-2000, 1200);
  c.closePath();
  c.fill();
  c.restore();

  // Chi tiết mảng nét vẽ tay thủ công
  for (let i = 0; i < 8; i++) {
    const cx = -1400 + i * 360, cy = -300 + (i % 2) * 80;
    const pts = [[cx, cy], [cx + 180, cy - 20], [cx + 220, cy + 40], [cx + 20, cy + 50]];
    const p = polyPath(pts);
    hatch(c, p, [cx, cy - 20, 220, 70], {
      density: 0.12,
      angle: 0.4,
      color: PAL.shade || '#99a',
      seed: seed + i
    });
  }

  // Lớp 3: Trung cảnh (mặt đất / sàn diễn)
  c.save();
  c.fillStyle = PAL.fills[0];
  c.fillRect(-2000, 240, 4000, 1000);
  c.strokeStyle = PAL.ink;
  c.lineWidth = 2.4;
  wob(c, [[-2000, 240], [2000, 240]], 1.5, seed + 1);
  c.restore();
}

// ===================== 3. THIẾT KẾ NHÂN VẬT (CHARACTER RIG) =====================
// Một nhân vật = MỘT defineRig() cho cả phim. Shot chỉ đổi POSE (góc khớp, vị trí), không vẽ lại nhân vật.
// Mỗi bộ phận vẽ trong toạ độ cục bộ của xương nó (+x dọc xương) → xoay quanh khớp, không bao giờ bị kéo giãn.
// Seed hình dáng (k.seed) cố định; chỉ nét viền được "boil" bằng k.boil. KHÔNG truyền thời gian vào blob()/curvePath().
// HERO, inkFill, limb được định nghĩa trong character-hero.js (đổi tên file theo nhân vật của bạn).

// Vẽ nhân vật: đặt pose → IK chân xuống điểm chạm → drawRig (tự đăng ký vùng chủ thể thật cho qa.mjs, ghi sai số chạm).
function drawCharacter(c, T, x, groundY) {
  const stride = 46, ph = T * 4.2;                                // chu kỳ bước, chân đối pha
  const footAt = s => [x + Math.cos(ph + s) * stride * .5, groundY - Math.max(0, Math.sin(ph + s)) * 22];
  const pose = {
    x, y: groundY - 108 - Math.abs(Math.sin(ph)) * 6, boil: rigBoil(T),   // hông thấp hơn tổng chiều dài chân (122) để chân không duỗi quá tầm
    angles: { body: Math.sin(ph * 2) * .03, head: Math.sin(ph * 2 + .6) * .05, armF: Math.sin(ph) * .5, armN: -Math.sin(ph) * .5 },
    look: Math.sin(T * .7),
  };
  const fF = footAt(Math.PI), fN = footAt(0);
  rigIK(HERO, pose, 'thighF', 'shinF', fF, 1);   // bend = 1: gối hướng về phía trước (nhân vật nhìn sang phải)
  rigIK(HERO, pose, 'thighN', 'shinN', fN, 1);
  drawRig(c, HERO, pose, { T, pins: [{ socket: 'footF', to: fF, tol: 3 }, { socket: 'footN', to: fN, tol: 3 }] });
}

// ===================== 4. DIỄN XUẤT & CAMERA (PERFORMANCE & SHOTS) =====================
// Vị trí nhân vật trong thế giới là hàm của thời gian phim T (không phải tau của shot) → liên tục qua vết cắt.
const heroX = T => -500 + T * 48;
const GROUND_Y = 240;

function shotCam(t, keys, hand = 2, seed = 3) {
  const v = keyPath(t, keys, { ease: easeInOutSine });
  const z = v[2];
  return {
    x: v[0] + (hand ? drift(t, seed, { amp: hand, freq: 0.5 }) / z : 0),
    y: v[1] + (hand ? drift(t, seed + 4, { amp: hand * 0.8, freq: 0.45 }) / z : 0),
    z: z,
    rot: v[3] ?? 0
  };
}

// Các Shot cụ thể (Mỗi shot là một camera trong thế giới)
function shotA(c, tau) {
  const T = tau;
  const v = shotCam(tau, [[0, -200, 0, 0.95], [5.0, 100, 20, 1.05]], 3);
  drawWorld(c, T, v, 10);
  applyView(c, v);
  drawCharacter(c, T, heroX(T), GROUND_Y);
}

function shotB(c, tau) {
  const T = 5.0 + tau;
  const v = shotCam(tau, [[0, 100, 20, 1.05], [5.0, -50, 60, 1.25]], 3);
  drawWorld(c, T, v, 20);
  applyView(c, v);
  drawCharacter(c, T, heroX(T), GROUND_Y);
}

function shotC(c, tau) {
  const T = 10.0 + tau;
  const v = shotCam(tau, [[0, -50, 60, 1.25], [5.0, 120, 40, 1.2]], 4);
  drawWorld(c, T, v, 30);
  applyView(c, v);
  drawCharacter(c, T, heroX(T), GROUND_Y);
}

function shotD(c, tau) {
  const T = 15.0 + tau;
  const v = shotCam(tau, [[0, 120, 40, 1.2], [5.0, 0, 0, 1.0]], 2);
  drawWorld(c, T, v, 40);
  applyView(c, v);
  drawCharacter(c, T, heroX(T), GROUND_Y);

  // Tiêu đề kết thúc trên màn hình
  if (tau > 1.5) {
    resetT(c);
    c.save();
    c.fillStyle = PAL.ink;
    c.font = 'bold 42px system-ui';
    c.textAlign = 'center';
    c.fillText('HAND-DRAWN ANIMATION', CX, CY - 240);
    c.restore();
  }
}

// ===================== 5. ÂM NHẠC & HIỆU ỨNG ÂM THANH (AUDIO SCORE) =====================
// Chữ ký đúng: score(ac, t0, dest) — core.js gọi với thời điểm bắt đầu t0 và nút đích (loa hoặc OfflineAudioContext).
const FILM_DUR = 20.0;
function score(ac, t0, dest) {
  const master = ac.createGain(); master.gain.value = 0.6;
  const comp = ac.createDynamicsCompressor(); master.connect(comp); comp.connect(dest);
  const beat = 60 / 110;
  for (let t = 0; t < FILM_DUR; t += beat) {                       // nhịp gõ nhẹ
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(140, t0 + t); o.frequency.exponentialRampToValueAtTime(40, t0 + t + 0.1);
    g.gain.setValueAtTime(0.2, t0 + t); g.gain.exponentialRampToValueAtTime(0.001, t0 + t + 0.12);
    o.connect(g); g.connect(master); o.start(t0 + t); o.stop(t0 + t + 0.15);
  }
  for (let t = 0.5, k = 0; t < FILM_DUR - 1; t += 1.0, k++) note(ac, master, pentHz(0, [0, 2, 4, 2, 1][k % 5], 262), t0, t, 0.85, 'triangle', 0.15);
}

// ===================== 6. KHỞI TẠO VÒNG LẶP PHIM (DEFINE FILM) =====================
defineFilm({
  palette: PALETTE,
  format: { ar: '16:9', width: 1920 },
  fps: 24,
  score,
  timeline: [
    { name: 'A-intro', dur: 5.0, fn: shotA },
    { name: 'B-conflict', dur: 5.0, fn: shotB },
    { name: 'C-action', dur: 5.0, fn: shotC },
    { name: 'D-triumph', dur: 5.0, fn: shotD },
  ],
});
</script>
