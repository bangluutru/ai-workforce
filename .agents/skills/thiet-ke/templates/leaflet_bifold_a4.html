<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<!-- Khổ trải A4 ngang 297x210mm gấp đôi thành A5 dọc; bù xén 3mm mỗi cạnh -->
<meta name="print:trim" content="297x210">
<meta name="print:bleed" content="3">
<title>[[Tên ấn phẩm]] - Bi-fold A4</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="css/dtp_layout.css">
<style>
/* ================= KHUNG IN - KHÔNG SỬA ================= */
/* Trang PDF = 303 x 216 mm. Mặt ngoài: [Bìa sau 148.5] [Bìa trước 148.5]; Mặt trong: [Trang 2] [Trang 3]. Nếp gấp tại x = 151.5mm */
@page { size: 303mm 216mm; margin: 0; }
:root {
  --bleed: 3mm; --safe: 6mm;
  /* ======= THIẾT KẾ: token ======= */
  --c-bg: #FFFFFF; --c-ink: #0F172A; --c-muted: #475569; --c-brand: #1E3A8A; --c-accent: #D97706;
  --c-dark: #0F172A; --c-on-dark: #F8FAFC;
  --f-head: "Spectral", "Be Vietnam Pro", serif; --f-body: "Be Vietnam Pro", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font-family: var(--f-body); color: var(--c-ink); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.sheet { position: relative; width: 303mm; height: 216mm; overflow: hidden; background: var(--c-bg);
         display: grid; grid-template-columns: 151.5mm 151.5mm; break-after: page; }
.panel { position: relative; height: 216mm; overflow: hidden; padding: calc(var(--bleed) + var(--safe)) var(--safe); }
.sheet > .panel:first-child { padding-left: calc(var(--bleed) + var(--safe)); }
.sheet > .panel:nth-child(2) { padding-right: calc(var(--bleed) + var(--safe)); }
.guides { position: absolute; inset: 0; pointer-events: none; z-index: 99; }
.guides .trim { position: absolute; left: 3mm; top: 3mm; width: 297mm; height: 210mm; outline: 0.3mm solid #e11d48; }
.guides .fold { position: absolute; top: 0; bottom: 0; left: 151.5mm; border-left: 0.3mm dashed #2563eb; }
@media screen { body { background: #d6d3d1; padding: 12mm; } .sheet { margin: 0 auto 12mm; box-shadow: 0 2mm 8mm rgba(0,0,0,.25); } }
@media print { .guides { display: none !important; } }
/* ================= HẾT KHUNG IN ================= */

/* ================= THIẾT KẾ - SỬA TỰ DO ================= */
h1, h2 { font-family: var(--f-head); margin: 0; line-height: 1.15; }
h2 { font-size: 18pt; color: var(--c-brand); margin-bottom: 5mm; }
p, li { font-size: 10pt; line-height: 1.55; margin: 0 0 3mm; }
p { text-align: justify; text-justify: inter-word; hyphens: auto; -webkit-hyphens: auto; text-rendering: optimizeLegibility; }
.cover { background: var(--c-dark); color: var(--c-on-dark); display: flex; flex-direction: column; justify-content: center; }
.cover h1 { font-size: 32pt; margin-bottom: 4mm; }
</style>
</head>
<body>
<section class="sheet">
  <div class="panel" data-dtp-frame="true">
    <h2>[[Liên hệ]]</h2>
    <p>[CẦN XÁC MINH: địa chỉ, điện thoại, email do khách hàng cung cấp]</p>
  </div>
  <div class="panel cover" data-dtp-frame="true">
    <h1>[[Tên thương hiệu / tiêu đề]]</h1>
    <p>[[Thông điệp chính]]</p>
  </div>
  <div class="guides"><div class="trim"></div><div class="fold"></div></div>
</section>
<section class="sheet">
  <div class="panel" data-dtp-frame="true"><h2>[[Trang 2]]</h2><p>[[Nội dung]]</p></div>
  <div class="panel" data-dtp-frame="true"><h2>[[Trang 3]]</h2><p>[[Nội dung]]</p></div>
  <div class="guides"><div class="trim"></div><div class="fold"></div></div>
</section>
</body>
</html>
