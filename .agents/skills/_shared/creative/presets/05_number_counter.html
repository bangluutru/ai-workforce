<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Preset 05 — Number Counter</title>
  __GSAP_SCRIPT_TAG__
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100vw; height: 100vh;
      background: var(--bg-color, #031525);
      color: var(--text-color, #FFFFFF);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .metric-card {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      padding: clamp(24px, 5vw, 60px);
    }
    .tag {
      font-size: clamp(12px, 1.6vw, 18px);
      font-weight: 700; letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent-color, #06B6D4);
      margin-bottom: clamp(12px, 2vh, 20px);
    }
    .counter-wrapper {
      display: flex; align-items: baseline; justify-content: center;
      margin-bottom: clamp(12px, 2vh, 24px);
    }
    .counter-value {
      font-size: clamp(64px, 12vw, 150px);
      font-weight: 900; line-height: 1;
      letter-spacing: -0.03em;
      color: var(--accent-color, #06B6D4);
      text-shadow: 0 0 50px rgba(6, 182, 212, 0.4);
      font-variant-numeric: tabular-nums;
    }
    .suffix {
      font-size: clamp(32px, 6vw, 70px);
      font-weight: 800;
      color: var(--accent-color, #06B6D4);
      margin-left: 6px;
    }
    .label {
      font-size: clamp(22px, 3.5vw, 42px);
      font-weight: 700;
      margin-bottom: 8px;
    }
    .sublabel {
      font-size: clamp(14px, 1.8vw, 22px);
      color: color-mix(in srgb, var(--text-color, #FFFFFF) 65%, transparent);
      max-width: 80%;
    }
  </style>
</head>
<body>
  <div class="metric-card">
    <div id="tag" class="tag"></div>
    <div class="counter-wrapper">
      <span id="counter" class="counter-value">0</span>
      <span id="suffix" class="suffix"></span>
    </div>
    <h2 id="label" class="label"></h2>
    <p id="sublabel" class="sublabel"></p>
  </div>

  <script>
    const props = __PROPS_JSON__;
    const duration = parseFloat("__DURATION__") || 6.0;

    document.documentElement.style.setProperty('--accent-color', props.accent_color || '#06B6D4');
    document.documentElement.style.setProperty('--bg-color', props.bg_color || '#031525');
    document.documentElement.style.setProperty('--text-color', props.text_color || '#FFFFFF');

    document.getElementById('tag').textContent = props.tag || 'CHỈ SỐ TĂNG TRƯỞNG';
    document.getElementById('label').textContent = props.label || 'Tỷ Lệ Hài Lòng Khách Hàng';
    document.getElementById('sublabel').textContent = props.sublabel || 'Đo lường trên 10.000+ dự án xuất bản tự động';
    document.getElementById('suffix').textContent = props.suffix || '%';

    const targetNumber = parseFloat(props.target_number) || 98.7;
    const isFloat = String(targetNumber).includes('.');
    const obj = { val: parseFloat(props.start_number) || 0 };
    const counterEl = document.getElementById('counter');

    const tl = gsap.timeline();

    tl.fromTo(".tag", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.2)
      .to(obj, {
        val: targetNumber,
        duration: Math.min(duration * 0.65, 3.2),
        ease: "power2.out",
        onUpdate: () => {
          counterEl.textContent = isFloat ? obj.val.toFixed(1) : Math.round(obj.val).toLocaleString('vi-VN');
        }
      }, 0.4)
      .fromTo(".counter-wrapper", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.8, ease: "back.out(1.5)" }, 0.4)
      .fromTo("#label", { opacity: 0, y: 25 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.8)
      .fromTo("#sublabel", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, 1.0)
      .to(".metric-card", { scale: 1.03, duration: Math.max(0.1, duration - 2.0), ease: "sine.inOut" }, 2.0);
  </script>
</body>
</html>
