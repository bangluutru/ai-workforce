<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Preset 10 — CTA Reveal</title>
  __GSAP_SCRIPT_TAG__
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100vw; height: 100vh;
      background: var(--bg-color, #150606);
      color: var(--text-color, #FFFFFF);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      perspective: 1000px;
    }
    .cta-container {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      padding: clamp(24px, 5vw, 60px);
      max-width: min(90vw, 1000px);
    }
    .headline {
      font-size: clamp(34px, 6vw, 76px);
      font-weight: 900; line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: clamp(12px, 2vh, 20px);
    }
    .subheadline {
      font-size: clamp(16px, 2.2vw, 26px);
      color: color-mix(in srgb, var(--text-color, #FFFFFF) 75%, transparent);
      line-height: 1.5;
      max-width: 85%;
      margin-bottom: clamp(24px, 4vh, 48px);
    }
    .btn-cta {
      display: inline-flex; align-items: center; justify-content: center;
      padding: clamp(14px, 2.5vh, 24px) clamp(32px, 5vw, 64px);
      border-radius: 9999px;
      font-size: clamp(18px, 2.5vw, 32px); font-weight: 900;
      letter-spacing: 0.08em; text-transform: uppercase;
      background: var(--accent-color, #EF4444);
      color: #FFFFFF;
      box-shadow: 0 0 40px var(--accent-color, #EF4444), 0 10px 30px rgba(0, 0, 0, 0.5);
      border: none; cursor: pointer;
      margin-bottom: clamp(16px, 2.5vh, 28px);
      position: relative;
    }
    .guarantee {
      font-size: clamp(13px, 1.6vw, 18px);
      color: color-mix(in srgb, var(--text-color, #FFFFFF) 60%, transparent);
      margin-bottom: 8px;
    }
    .domain {
      font-size: clamp(14px, 1.8vw, 22px);
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--accent-color, #EF4444);
    }
  </style>
</head>
<body>
  <div class="cta-container">
    <h1 id="headline" class="headline"></h1>
    <p id="subheadline" class="subheadline"></p>
    <div id="btn-cta" class="btn-cta"></div>
    <p id="guarantee" class="guarantee"></p>
    <p id="domain" class="domain"></p>
  </div>

  <script>
    const props = __PROPS_JSON__;
    const duration = parseFloat("__DURATION__") || 5.0;

    document.documentElement.style.setProperty('--accent-color', props.accent_color || '#EF4444');
    document.documentElement.style.setProperty('--bg-color', props.bg_color || '#150606');
    document.documentElement.style.setProperty('--text-color', props.text_color || '#FFFFFF');

    document.getElementById('headline').textContent = props.headline || 'Sẵn Sàng Nâng Tầm Video?';
    document.getElementById('subheadline').textContent = props.subheadline || 'Khám phá quy trình sản xuất video thông minh tự động hóa ngay hôm nay';
    document.getElementById('btn-cta').textContent = props.cta_text || 'BẮT ĐẦU NGAY';
    document.getElementById('guarantee').textContent = props.guarantee || 'Hoàn tiền 100% trong 30 ngày · Không cần thẻ tín dụng';
    document.getElementById('domain').textContent = props.domain || 'aiworkforce.vn';

    const tl = gsap.timeline();

    tl.fromTo("#headline", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.2)
      .fromTo("#subheadline", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 0.5)
      .fromTo("#btn-cta", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.9, ease: "back.out(2.0)" }, 0.8)
      .fromTo("#guarantee", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 1.3)
      .fromTo("#domain", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6 }, 1.5);

    // Pulse animation cho nút CTA
    gsap.to("#btn-cta", {
      scale: 1.05,
      boxShadow: "0 0 60px " + (props.accent_color || '#EF4444') + ", 0 15px 40px rgba(0,0,0,0.6)",
      repeat: -1, yoyo: true, duration: 0.8, ease: "sine.inOut"
    });
  </script>
</body>
</html>
