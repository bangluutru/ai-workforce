<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Preset 07 — Product Spotlight</title>
  __GSAP_SCRIPT_TAG__
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100vw; height: 100vh;
      background: var(--bg-color, #120E05);
      color: var(--text-color, #FFFFFF);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      perspective: 1200px;
    }
    .spotlight-cone {
      position: absolute;
      width: 80vw; height: 80vh;
      background: radial-gradient(circle, var(--accent-color, #F59E0B) 0%, transparent 65%);
      opacity: 0.15; filter: blur(80px);
      pointer-events: none;
    }
    .product-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: clamp(20px, 3.5vw, 36px);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 50px rgba(245, 158, 11, 0.2);
      padding: clamp(28px, 5vw, 64px);
      width: min(92vw, 900px);
      text-align: left;
      position: relative;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px; border-radius: 9999px;
      font-size: clamp(11px, 1.4vw, 15px); font-weight: 800;
      letter-spacing: 0.15em; text-transform: uppercase;
      background: var(--accent-color, #F59E0B); color: #000;
      margin-bottom: clamp(12px, 2vh, 20px);
    }
    .product-name {
      font-size: clamp(28px, 4.5vw, 56px);
      font-weight: 900; line-height: 1.15;
      margin-bottom: clamp(12px, 2vh, 20px);
    }
    .specs-list {
      list-style: none;
      margin-bottom: clamp(16px, 2.5vh, 28px);
    }
    .spec-item {
      font-size: clamp(14px, 1.8vw, 22px);
      color: color-mix(in srgb, var(--text-color, #FFFFFF) 85%, transparent);
      margin-bottom: 8px;
      display: flex; align-items: center; gap: 10px;
    }
    .spec-item::before {
      content: "✦";
      color: var(--accent-color, #F59E0B);
      font-weight: 900;
    }
    .price-box {
      display: flex; align-items: baseline; gap: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .price-current {
      font-size: clamp(32px, 5vw, 60px);
      font-weight: 900;
      color: var(--accent-color, #F59E0B);
    }
    .price-original {
      font-size: clamp(16px, 2.2vw, 26px);
      color: color-mix(in srgb, var(--text-color, #FFFFFF) 45%, transparent);
      text-decoration: line-through;
    }
  </style>
</head>
<body>
  <div class="spotlight-cone"></div>
  <div class="product-card">
    <div id="badge" class="badge"></div>
    <h1 id="product-name" class="product-name"></h1>
    <ul id="specs" class="specs-list"></ul>
    <div class="price-box">
      <span id="price" class="price-current"></span>
      <span id="orig-price" class="price-original"></span>
    </div>
  </div>

  <script>
    const props = __PROPS_JSON__;
    // P3: prop khai báo rỗng ("") nghĩa là CỐ Ý để trống; chỉ khi thiếu hẳn khóa mới dùng giá trị mặc định đã gộp từ registry.
    const pv = (k) => (props[k] === undefined || props[k] === null) ? "" : String(props[k]);
    const duration = parseFloat("__DURATION__") || 7.0;

    document.documentElement.style.setProperty('--accent-color', props.accent_color || '#F59E0B');
    document.documentElement.style.setProperty('--bg-color', props.bg_color || '#120E05');
    document.documentElement.style.setProperty('--text-color', props.text_color || '#FFFFFF');

    document.getElementById('badge').textContent = pv('badge');
    document.getElementById('product-name').textContent = pv('product_name');
    document.getElementById('price').textContent = pv('price');
    document.getElementById('orig-price').textContent = pv('original_price');

    const specs = props.specs || ['Chuyển động GSAP 60FPS', 'Render Offline 1:1 Realtime', '100% Khử Mùi AI'];
    const ul = document.getElementById('specs');
    specs.forEach(s => {
      const li = document.createElement('li');
      li.className = 'spec-item';
      li.textContent = s;
      ul.appendChild(li);
    });

    const tl = gsap.timeline();

    tl.fromTo(".spotlight-cone", { scale: 0.5, opacity: 0 }, { scale: 1.2, opacity: 0.2, duration: 1.2, ease: "power2.out" })
      .fromTo(".product-card", { y: 60, rotationX: 15, opacity: 0 }, { y: 0, rotationX: 0, opacity: 1, duration: 1.0, ease: "power3.out" }, 0.2)
      .fromTo("#badge", { scale: 0 }, { scale: 1, duration: 0.6, ease: "back.out(2)" }, 0.5)
      .fromTo("#product-name", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.8 }, 0.7)
      .fromTo(".spec-item", { opacity: 0, x: -15 }, { opacity: 1, x: 0, stagger: 0.2, duration: 0.6 }, 0.9)
      .fromTo(".price-box", { opacity: 0, y: 15 }, { opacity: 1, y: 0, duration: 0.8 }, 1.5)
      .to(".product-card", { y: -8, duration: Math.max(0.1, duration - 2.3), ease: "sine.inOut" }, 2.3);
  </script>
</body>
</html>
