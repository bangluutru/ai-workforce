<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Preset 06 — Logo Reveal</title>
  __GSAP_SCRIPT_TAG__
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100vw; height: 100vh;
      background: var(--bg-color, #090A1A);
      color: var(--text-color, #FFFFFF);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      perspective: 1000px;
    }
    .reveal-box {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      position: relative;
    }
    .ring-aura {
      position: absolute;
      width: clamp(160px, 25vw, 320px);
      height: clamp(160px, 25vw, 320px);
      border-radius: 50%;
      border: 2px solid var(--accent-color, #6366F1);
      box-shadow: 0 0 50px var(--accent-color, #6366F1), inset 0 0 30px var(--accent-color, #6366F1);
      opacity: 0;
    }
    .logo-emblem {
      width: clamp(80px, 12vw, 150px);
      height: clamp(80px, 12vw, 150px);
      border-radius: clamp(18px, 3vw, 32px);
      background: linear-gradient(135deg, var(--accent-color, #6366F1), #A855F7);
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(38px, 6vw, 76px); font-weight: 900;
      color: #FFFFFF;
      box-shadow: 0 10px 40px rgba(99, 102, 241, 0.5);
      margin-bottom: clamp(16px, 3vh, 32px);
      z-index: 2;
    }
    .brand-name {
      font-size: clamp(34px, 5vw, 72px);
      font-weight: 900; letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 8px;
      z-index: 2;
    }
    .tagline {
      font-size: clamp(14px, 2vw, 24px);
      color: color-mix(in srgb, var(--text-color, #FFFFFF) 70%, transparent);
      letter-spacing: 0.05em;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="reveal-box">
    <div class="ring-aura"></div>
    <div id="emblem" class="logo-emblem">⚡</div>
    <h1 id="brand-name" class="brand-name"></h1>
    <p id="tagline" class="tagline"></p>
  </div>

  <script>
    const props = __PROPS_JSON__;
    // P3: prop khai báo rỗng ("") nghĩa là CỐ Ý để trống; chỉ khi thiếu hẳn khóa mới dùng giá trị mặc định đã gộp từ registry.
    const pv = (k) => (props[k] === undefined || props[k] === null) ? "" : String(props[k]);
    const duration = parseFloat("__DURATION__") || 5.0;

    document.documentElement.style.setProperty('--accent-color', props.accent_color || '#6366F1');
    document.documentElement.style.setProperty('--bg-color', props.bg_color || '#090A1A');
    document.documentElement.style.setProperty('--text-color', props.text_color || '#FFFFFF');

    const brandName = pv('brand_name');
    document.getElementById('brand-name').textContent = brandName;
    document.getElementById('tagline').textContent = pv('tagline');
    if (props.logo_url) {
      const em = document.getElementById('emblem');
      em.textContent = '';
      em.style.cssText = 'width:auto;height:auto;background:none;box-shadow:none;border-radius:0;';
      const img = document.createElement('img');
      img.src = props.logo_url;
      img.alt = brandName;
      img.style.cssText = 'max-width:min(70vw,900px);max-height:30vh;display:block;';
      em.appendChild(img);
      if (props.hide_brand_name) { document.getElementById('brand-name').style.display = 'none'; }
    } else if (props.logo_char) {
      document.getElementById('emblem').textContent = props.logo_char;
    } else {
      document.getElementById('emblem').textContent = brandName.charAt(0);
    }

    const tl = gsap.timeline();

    tl.fromTo(".ring-aura", { scale: 0.2, opacity: 1 }, { scale: 2.2, opacity: 0, duration: 1.5, ease: "power2.out" }, 0.2)
      .fromTo("#emblem", { scale: 0, rotationY: 180, opacity: 0 }, { scale: 1, rotationY: 0, opacity: 1, duration: 1.1, ease: "back.out(1.8)" }, 0.3)
      .fromTo("#brand-name", { opacity: 0, y: 30, letterSpacing: "0.3em" }, { opacity: 1, y: 0, letterSpacing: "0.12em", duration: 1.0, ease: "power3.out" }, 0.8)
      .fromTo("#tagline", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, 1.2)
      .to(".reveal-box", { scale: 1.04, duration: Math.max(0.1, duration - 2.0), ease: "sine.inOut" }, 2.0);
  </script>
</body>
</html>
