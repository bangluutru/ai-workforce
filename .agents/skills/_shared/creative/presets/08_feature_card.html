<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Preset 08 — Feature Cards</title>
  __GSAP_SCRIPT_TAG__
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100vw; height: 100vh;
      background: var(--bg-color, #0D0B18);
      color: var(--text-color, #FFFFFF);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .container {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: clamp(24px, 5vw, 60px);
      text-align: center;
    }
    .tag {
      font-size: clamp(12px, 1.5vw, 17px);
      font-weight: 700; letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent-color, #8B5CF6);
      margin-bottom: clamp(8px, 1.5vh, 16px);
    }
    .title {
      font-size: clamp(28px, 4.5vw, 56px);
      font-weight: 900; line-height: 1.15;
      margin-bottom: clamp(20px, 3.5vh, 40px);
    }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: clamp(16px, 2vw, 28px);
      width: min(94vw, 1100px);
    }
    .card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: clamp(14px, 2vw, 24px);
      padding: clamp(20px, 3vw, 32px);
      text-align: left;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      position: relative;
    }
    .card-icon {
      width: 38px; height: 38px;
      border-radius: 10px;
      background: var(--accent-color, #8B5CF6);
      color: #FFF;
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 18px;
      margin-bottom: 14px;
    }
    .card-title {
      font-size: clamp(18px, 2.2vw, 24px);
      font-weight: 800;
      margin-bottom: 8px;
    }
    .card-desc {
      font-size: clamp(13px, 1.5vw, 16px);
      color: color-mix(in srgb, var(--text-color, #FFFFFF) 70%, transparent);
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="tag" class="tag"></div>
    <h1 id="title" class="title"></h1>
    <div id="cards" class="cards-grid"></div>
  </div>

  <script>
    const props = __PROPS_JSON__;
    const duration = parseFloat("__DURATION__") || 7.0;

    document.documentElement.style.setProperty('--accent-color', props.accent_color || '#8B5CF6');
    document.documentElement.style.setProperty('--bg-color', props.bg_color || '#0D0B18');
    document.documentElement.style.setProperty('--text-color', props.text_color || '#FFFFFF');

    document.getElementById('tag').textContent = props.tag || 'TÍNH NĂNG CỐT LÕI';
    document.getElementById('title').textContent = props.title || 'Nền Tảng Đồ Họa Tự Chủ';

    const features = props.features || [
      { title: "Bố Cục Tự Động", desc: "Chuẩn hóa Safe Zone 16:9, 1:1, 9:16" },
      { title: "Đồng Bộ Nhịp Âm", desc: "Bắt beat âm nhạc và voiceover chính xác" },
      { title: "Bảo Mật Cấp Cao", desc: "Zero External API, bảo vệ tuyệt đối mã nguồn" }
    ];

    const cardsEl = document.getElementById('cards');
    features.forEach((f, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-icon">${i + 1}</div>
        <div class="card-title">${f.title}</div>
        <div class="card-desc">${f.desc}</div>
      `;
      cardsEl.appendChild(card);
    });

    const tl = gsap.timeline();

    tl.fromTo("#tag", { opacity: 0, y: -15 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 0.2)
      .fromTo("#title", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.4)
      .fromTo(".card", {
        opacity: 0, y: 40, scale: 0.95
      }, {
        opacity: 1, y: 0, scale: 1, duration: 0.8, stagger: 0.2, ease: "back.out(1.4)"
      }, 0.6)
      .to(".container", { scale: 1.02, duration: Math.max(0.1, duration - 1.8), ease: "sine.inOut" }, 1.8);
  </script>
</body>
</html>
